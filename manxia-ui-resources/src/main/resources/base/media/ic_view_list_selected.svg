<?xml version="1.0" encoding="UTF-8"?>
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- 列表图标 - 选中状态 -->
  <!-- 三行列表项 -->
  <line x1="8" y1="6" x2="21" y2="6" stroke="#007DFF" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="8" y1="12" x2="21" y2="12" stroke="#007DFF" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="8" y1="18" x2="21" y2="18" stroke="#007DFF" stroke-width="2.5" stroke-linecap="round"/>
  <!-- 三个圆点 - 填充蓝色 -->
  <circle cx="3.5" cy="6" r="2" fill="#007DFF"/>
  <circle cx="3.5" cy="12" r="2" fill="#007DFF"/>
  <circle cx="3.5" cy="18" r="2" fill="#007DFF"/>
</svg>

