<?xml version="1.0" encoding="UTF-8"?>
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- 刮削图标：放大镜+数据流，表示从网络搜索并获取元数据 -->
  <!-- 放大镜主体 -->
  <circle cx="10" cy="10" r="6" stroke="currentColor" stroke-width="2" fill="none"/>
  <!-- 放大镜手柄 -->
  <line x1="14.5" y1="14.5" x2="20" y2="20" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  <!-- 数据流线条（表示从网络获取数据） -->
  <path d="M7 8h6M7 10h4M7 12h5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
  <!-- 下载箭头（表示获取/导入数据） -->
  <path d="M19 4v4h-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M19 4l-5 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
</svg>
