name: Build HAP (构建 / Build)

# -----------------------------------------------------------------------------
# 本仓库适配说明 / Manxia adaptation
#   - CI_IMAGE 用 :api23 —— 本工程 compatibleSdkVersion/targetSdkVersion = 6.1.0(23)
#     (command-line-tools 6.1.0.818); 模板默认的 api26r 与本工程 SDK 不匹配。
#   - 无 git 子模块依赖(4 个 submodule 未被任何 oh-package.json5 引用),
#     故 checkout 不开 submodules: recursive。
#   - build-profile.json5 被 .gitignore 忽略(DevEco Studio 会把本机签名材料写进去),
#     CI 缺失时由 build-profile.json5.example 生成;.github/scripts/strip_signing.py
#     作为兜底,剥离任何残留的 signingConfigs,产出未签名 HAP。
# -----------------------------------------------------------------------------
# =============================================================================
# 消费方模板 / CONSUMER TEMPLATE
# -----------------------------------------------------------------------------
# 这是「在 HarmonyOS 工程里云端构建 .hap」的模板: 复制到你的工程
# .github/workflows/build.yml 即可用, 全程无需 DevEco Studio。
# This is the "build a .hap in the cloud" template: copy it to your project's
# .github/workflows/build.yml and you are done - no DevEco Studio required.
#
# 用法 / Usage
#   1. 改下面 env.CI_IMAGE 的 tag, 与你工程 compatibleSdkVersion 匹配
#      (api26 / api26b2 / api24 / api23, 见 harmonyos-ci 仓库 README)。
#      Set env.CI_IMAGE below to the tag matching your compatibleSdkVersion.
#   2. 若你的工程 build-profile.json5 带本机 signingConfigs, 一并复制
#      .github/scripts/strip_signing.py 到同路径(本模板已自动调用; 文件不存在
#      或无需剥离时会自动跳过, 不会报红)。
#      Copy .github/scripts/strip_signing.py too if your build-profile.json5
#      carries machine-local signingConfigs (auto-skipped when not needed).
#
# 产出 / Output
#   - artifact: 未签名 debug HAP / unsigned debug HAP
#   - push main/master 时刷新滚动 Release `latest`(正式发布, 非预发布),
#     发布说明按本次推送的提交自动生成(版本 / 提交 / 变更清单 / 变更文件)
# =============================================================================

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      image:
        description: '覆盖 CI 镜像 / Override CI image (ghcr.io/owner/harmonyos-ci:<tag>)'
        required: false
        default: ''

concurrency:
  group: build-hap-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

defaults:
  run:
    shell: bash

env:
  # ← 唯一需要按项目修改的地方 / the only line to adapt per project
  CI_IMAGE: ghcr.io/dalongzhuazi/harmonyos-ci:api23

jobs:
  # 防呆 / Guard: 本 workflow 属于「HarmonyOS 应用工程仓库」。
  # 若被留在 harmonyos-ci 这类只有镜像和文档的仓库里, 每次 push 都会因为找不到
  # build-profile.json5 而变红。这里先判定, 非工程就直接跳过而不是误报失败。
  # This workflow belongs in an app project repo. In a repo without a HarmonyOS
  # project it would fail on every push - detect and skip cleanly instead.
  guard:
    name: 检查是否 HarmonyOS 工程 / Detect HarmonyOS project
    runs-on: ubuntu-latest
    outputs:
      is_project: ${{ steps.check.outputs.is_project }}
    steps:
      - name: Checkout 检出代码 / Checkout
        uses: actions/checkout@v4

      - name: 判定工程标志文件 / Check project markers
        id: check
        run: |
          # build-profile.json5 在本仓库被 .gitignore 忽略(含本机签名材料),
          # 因此同时接受 build-profile.json5.example 作为工程标志。
          # build-profile.json5 is git-ignored here (machine-local signing data),
          # so build-profile.json5.example also counts as the project marker.
          if [ -f oh-package.json5 ] && { [ -f build-profile.json5 ] || [ -f build-profile.json5.example ]; }; then
            echo "is_project=true" >> "$GITHUB_OUTPUT"
            echo "OK: HarmonyOS 工程 / project detected"
          else
            echo "is_project=false" >> "$GITHUB_OUTPUT"
            echo "::notice::未找到 oh-package.json5 + build-profile.json5(或 .example), 跳过构建。本 workflow 需复制到 HarmonyOS 应用工程仓库使用。/ Not a HarmonyOS project - skipping."
          fi

  prepare:
    needs: guard
    if: needs.guard.outputs.is_project == 'true'
    name: 解析 CI 镜像 / Resolve CI image
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.img.outputs.image }}
    steps:
      - name: 计算镜像引用 / Compute image reference
        id: img
        env:
          INPUT_IMAGE: ${{ inputs.image }}
          DEFAULT_IMAGE: ${{ env.CI_IMAGE }}
        run: |
          image="${INPUT_IMAGE:-$DEFAULT_IMAGE}"
          echo "Use CI image / 使用镜像: $image"
          echo "image=$image" >> "$GITHUB_OUTPUT"

  build:
    name: 构建 HAP (debug, 未签名) / Assemble HAP (debug, unsigned)
    needs: prepare
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.prepare.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout 检出代码 / Checkout
        uses: actions/checkout@v4
        # 引入 git 子模块时打开 / enable when the project uses submodules
        # with:
        #   submodules: recursive

      - name: 准备工程配置 / Prepare build-profile.json5
        run: |
          if [ -f build-profile.json5 ]; then
            echo "OK: build-profile.json5 已存在 / already present"
          elif [ -f build-profile.json5.example ]; then
            cp -v build-profile.json5.example build-profile.json5
            echo "::notice::build-profile.json5 未入库(本机签名配置不入库),已由 .example 生成 / generated from .example"
          else
            echo "::error::缺少 build-profile.json5 与 build-profile.json5.example / build config missing"
            exit 1
          fi

      - name: 剥离本机签名配置 / Strip local signing config
        run: |
          if [ -f .github/scripts/strip_signing.py ]; then
            python3 .github/scripts/strip_signing.py build-profile.json5
          else
            echo "::notice::未找到 .github/scripts/strip_signing.py, 跳过 / not found, skipped"
          fi

      - name: 缓存 hvigor & oh_modules / Cache hvigor & oh_modules
        uses: actions/cache@v4
        with:
          path: |
            /root/.hvigor
            **/oh_modules
          key: hvigor-${{ runner.os }}-${{ hashFiles('**/oh-package-lock.json5') }}
          restore-keys: |
            hvigor-${{ runner.os }}-

      - name: 安装依赖 / Install dependencies (ohpm)
        run: ohpm install --all

      - name: 构建 HAP / Build HAP (debug)
        run: hvigorw assembleHap --mode module -p product=default -p buildMode=debug --no-daemon --stacktrace

      - name: 收集并校验产物 / Collect & verify HAP
        run: |
          set -eu
          mkdir -p dist
          find . -type f -name '*.hap' -path '*/outputs/*' \
            -not -path './oh_modules/*' -not -path './node_modules/*' \
            -exec cp -v {} dist/ \;
          shopt -s nullglob
          haps=(dist/*.hap)
          if [ ${#haps[@]} -eq 0 ]; then
            echo "::error::No .hap produced - check the build log / 未产出 hap, 检查上方构建日志"
            exit 1
          fi
          for h in "${haps[@]}"; do
            size=$(stat -c%s "$h")
            if [ "$size" -le 0 ]; then echo "::error::$h is empty / 为空"; exit 1; fi
            echo "$h : $size bytes"
          done

      - name: 上传 artifact / Upload HAP artifact
        uses: actions/upload-artifact@v4
        with:
          name: hap-unsigned
          path: dist/
          if-no-files-found: error
          retention-days: 14
  release:
    name: 发布阶段性构建 / Publish staged build (rolling 'latest')
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout 检出代码 / Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 生成变更清单需要完整历史 / full history for the changelog

      - name: 下载 HAP / Download HAP artifact
        uses: actions/download-artifact@v4
        with:
          name: hap-unsigned
          path: dist

      - name: 生成发布说明 / Generate release notes
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -eu

          # 版本号取自 AppScope/app.json5 / version from AppScope/app.json5
          VERSION_NAME=$(grep -oE '"versionName"[[:space:]]*:[[:space:]]*"[^"]+"' AppScope/app.json5 | head -n1 | sed -E 's/.*"([^"]+)"$/\1/')
          VERSION_CODE=$(grep -oE '"versionCode"[[:space:]]*:[[:space:]]*[0-9]+' AppScope/app.json5 | head -n1 | grep -oE '[0-9]+$')
          VERSION_DISPLAY="${VERSION_NAME:-unknown} (${VERSION_CODE:-unknown})"

          # 本次推送的提交区间(兼容首次推送 / 强制推送)/ commit range of this push
          RANGE_NOTE=""
          if [ -n "${BEFORE:-}" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            RANGE="${BEFORE}..${AFTER}"
          else
            RANGE=""
            RANGE_NOTE="无法定位上一次 main 提交(首次推送或强制推送),下列为最近 50 条提交。/ Previous tip not found - showing the latest 50 commits."
          fi

          if [ -n "$RANGE" ]; then
            TOTAL=$(git rev-list --count "$RANGE")
            LOG=$(git log --pretty=format:'- `%h` %s — %an, %ad' --date=format:'%Y-%m-%d %H:%M' "$RANGE" | head -n 50)
            STAT=$(git diff --stat "$RANGE" | tail -n 60)
          else
          TOTAL=0   # 回退路径不显示"本次共 N 个提交" / no count on the fallback path
            LOG=$(git log --pretty=format:'- `%h` %s — %an, %ad' --date=format:'%Y-%m-%d %H:%M' -n 50 HEAD)
            STAT=$(git diff --stat HEAD~1 HEAD 2>/dev/null | tail -n 60 || true)
          fi
          [ -n "$LOG" ] || LOG='- (无提交信息 / no commit info)'
          [ -n "$STAT" ] || STAT='(无文件变更 / no file changes)'

          MORE=""
          if [ "$TOTAL" -gt 50 ]; then
            MORE="
          > 本次共 ${TOTAL} 个提交,此处仅列出最近 50 条 —— 完整列表见 [提交历史](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commits/${AFTER})。"
          fi

          HAP_FILE=$(ls dist/*.hap | head -n1)
          HAP_NAME=$(basename "$HAP_FILE")
          HAP_SIZE=$(numfmt --to=iec --suffix=B "$(stat -c%s "$HAP_FILE")")

          {
            echo '## 阶段性构建 / Staged build'
            echo
            echo '由 `main` 分支最新提交自动构建的**未签名** debug HAP。'
            echo 'Unsigned debug HAP, built automatically from the latest `main` commit.'
            echo
            echo '| 项目 / Item | 值 / Value |'
            echo '|---|---|'
            echo "| 版本 / Version | \`${VERSION_DISPLAY}\` |"
            echo "| 提交 / Commit | [\`${AFTER:0:7}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${AFTER}) |"
            echo "| 分支 / Branch | \`${GITHUB_REF_NAME}\` |"
            echo "| 构建 / Build | [#${GITHUB_RUN_NUMBER}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}) · $(date -u '+%Y-%m-%d %H:%M UTC') |"
            echo "| 产物 / Artifact | \`${HAP_NAME}\` · ${HAP_SIZE} |"
            echo
            echo "### 本次变更 / What's Changed"
            echo
            echo "$LOG"
            echo "$MORE"
            if [ -n "$RANGE_NOTE" ]; then
              echo
              echo "> $RANGE_NOTE"
            fi
            echo
            echo '### 变更文件 / Changed Files'
            echo
            echo '```'
            echo "$STAT"
            echo '```'
            echo
            echo '> ⚠️ 未签名,安装前请用 DevEco Studio 或 hap-sign-tool 重新签名。'
            echo '> Unsigned - re-sign it with DevEco Studio or hap-sign-tool before installing.'
          } > body.md

          echo "RELEASE_TITLE=阶段性构建 v${VERSION_NAME:-unknown} · ${AFTER:0:7}" >> "$GITHUB_ENV"

      - name: 更新滚动 Release latest / Refresh rolling 'latest' release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          # 先删后建,使 tag `latest` 始终指向最新一次 main 构建 / keep the rolling tag on the newest main build
          gh release delete latest --cleanup-tag --yes 2>/dev/null || true
          gh release create latest \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TITLE" \
            --notes-file body.md \
            dist/*.hap
