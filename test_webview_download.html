<!DOCTYPE html>
<html>
<head>
<title>WebView Download Test</title>
<style>
body { font-family: monospace; padding: 20px; }
.pass { color: green; }
.fail { color: red; }
.info { color: blue; }
pre { background: #f0f0f0; padding: 10px; overflow: auto; }
</style>
</head>
<body>
<h1>WebView Download Behavior Test</h1>
<div id="results"></div>

<script>
const results = document.getElementById('results');
function log(msg, cls = '') {
  const div = document.createElement('div');
  div.className = cls;
  div.textContent = `[${new Date().toISOString().substr(11,12)}] ${msg}`;
  results.appendChild(div);
}

// ============================================================
// TEST 1: Does runJavaScript wait for async IIFE?
// ============================================================
async function test1() {
  log('=== TEST 1: Async IIFE behavior ===');

  // Simulate what runJavaScript does: evaluate the script and return the result
  const script = `
    (async () => {
      window.__test1Result = 'pending';
      await new Promise(r => setTimeout(r, 100));
      window.__test1Result = 'done';
    })();
    'started';
  `;

  // This simulates runJavaScript: it returns the synchronous result
  const syncResult = eval(script);
  log(`Sync result: "${syncResult}"`, 'info');
  log(`window.__test1Result immediately after: "${window.__test1Result}"`, 'info');

  // Wait and check again
  await new Promise(r => setTimeout(r, 200));
  log(`window.__test1Result after 200ms: "${window.__test1Result}"`,
    window.__test1Result === 'done' ? 'pass' : 'fail');

  log('CONCLUSION: runJavaScript returns sync result immediately, async code runs later');
}

// ============================================================
// TEST 2: Does fetch() work with credentials?
// ============================================================
async function test2() {
  log('=== TEST 2: fetch() with credentials ===');

  try {
    // Test with a simple URL (will fail due to CORS, but we can check the behavior)
    const resp = await fetch('https://httpbin.org/get', { credentials: 'include' });
    log(`fetch status: ${resp.status}`, 'info');
    const data = await resp.json();
    log(`fetch headers received: ${Object.keys(data.headers).length}`, 'info');
    log('fetch() with credentials works', 'pass');
  } catch (e) {
    log(`fetch error: ${e.message}`, 'info');
    log('fetch() failed (expected in cross-origin context)', 'info');
  }
}

// ============================================================
// TEST 3: Chunked data transfer via polling
// ============================================================
async function test3() {
  log('=== TEST 3: Chunked data transfer ===');

  // Simulate large file data
  const testData = new Uint8Array(1024 * 100); // 100KB
  for (let i = 0; i < testData.length; i++) testData[i] = i % 256;

  // Store in global variable (simulating WebView fetch result)
  window.__dlBytes = testData;
  window.__dlResult = JSON.stringify({ size: testData.length });

  // Simulate polling
  const startTime = Date.now();
  let pollCount = 0;
  while (Date.now() - startTime < 5000) {
    pollCount++;
    const result = window.__dlResult;
    if (result && result.length > 0) {
      try {
        const parsed = JSON.parse(result);
        if (parsed.size) {
          log(`Poll ${pollCount}: Got size=${parsed.size} after ${Date.now()-startTime}ms`, 'pass');
          break;
        }
      } catch (e) {
        log(`Poll ${pollCount}: Parse error: ${e.message}`, 'fail');
      }
    }
    await new Promise(r => setTimeout(r, 100));
  }

  // Simulate chunked read
  const chunkSize = 32768;
  const totalChunks = Math.ceil(testData.length / chunkSize);
  let totalRead = 0;

  const chunkStart = Date.now();
  for (let i = 0; i < totalChunks; i++) {
    const offset = i * chunkSize;
    const end = Math.min(offset + chunkSize, testData.length);
    const slice = window.__dlBytes.subarray(offset, end);

    // Convert to base64 (simulating what we'd send back to native)
    let binary = '';
    for (let j = 0; j < slice.length; j++) {
      binary += String.fromCharCode(slice[j]);
    }
    const base64 = btoa(binary);
    totalRead += slice.length;
  }
  const chunkTime = Date.now() - chunkStart;

  log(`Chunked transfer: ${totalChunks} chunks, ${totalRead} bytes in ${chunkTime}ms`, 'pass');
  log(`Throughput: ${(totalRead / 1024 / (chunkTime/1000)).toFixed(0)} KB/s`, 'info');

  // Estimate for 5MB file
  const estTime5MB = (chunkTime / totalRead) * (5 * 1024 * 1024);
  log(`Estimated time for 5MB: ${(estTime5MB/1000).toFixed(1)}s`, 'info');
}

// ============================================================
// TEST 4: Does window.__dlResult stay set after async code?
// ============================================================
async function test4() {
  log('=== TEST 4: Global variable persistence ===');

  // Clear
  delete window.__dlResult;
  delete window.__dlBytes;

  // Simulate the start script
  const startScript = `
    (async () => {
      try {
        window.__dlBytes = new Uint8Array(1024);
        for (let i = 0; i < 1024; i++) window.__dlBytes[i] = i % 256;
        window.__dlResult = JSON.stringify({ size: 1024 });
      } catch (e) {
        window.__dlResult = JSON.stringify({ error: e.message });
      }
    })();
    'started';
  `;

  // Execute (simulating runJavaScript)
  const syncResult = eval(startScript);
  log(`Sync result: "${syncResult}"`, 'info');

  // Poll
  let found = false;
  for (let i = 0; i < 20; i++) {
    await new Promise(r => setTimeout(r, 50));
    if (window.__dlResult) {
      found = true;
      log(`Found __dlResult after ${(i+1)*50}ms: ${window.__dlResult}`, 'pass');
      break;
    }
  }

  if (!found) {
    log('__dlResult never set!', 'fail');
  }
}

// ============================================================
// TEST 5: What happens with undefined result?
// ============================================================
async function test5() {
  log('=== TEST 5: undefined/null handling ===');

  // Simulate runJavaScript returning undefined
  const undefinedResult = undefined;
  const nullResult = null;

  log(`undefined || '' = "${undefinedResult || ''}" (length: ${(undefinedResult || '').length})`, 'info');
  log(`null || '' = "${nullResult || ''}" (length: ${(nullResult || '').length})`, 'info');
  log(`typeof (undefined || '') = ${typeof (undefinedResult || '')}`, 'info');

  // Test JSON.parse with empty string
  try {
    JSON.parse('');
    log('JSON.parse("") succeeded', 'info');
  } catch (e) {
    log(`JSON.parse("") failed: ${e.message}`, 'info');
  }

  // Test JSON.parse with "undefined"
  try {
    JSON.parse('undefined');
    log('JSON.parse("undefined") succeeded', 'info');
  } catch (e) {
    log(`JSON.parse("undefined") failed: ${e.message}`, 'info');
  }

  log('CONCLUSION: JSON.parse("") and JSON.parse("undefined") both fail');
}

// Run all tests
(async () => {
  await test1();
  log('');
  await test3();
  log('');
  await test4();
  log('');
  await test5();
  log('');
  log('=== ALL TESTS COMPLETE ===');
})();
</script>
</body>
</html>
