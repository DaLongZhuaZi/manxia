<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- 电子书源图标：平板/电子阅读器 -->
  <!-- 设备外框 -->
  <rect x="5" y="2" width="14" height="20" rx="2" stroke="#8A8A8A" stroke-width="1.5" fill="none"/>
  
  <!-- 屏幕区域 -->
  <rect x="7" y="4" width="10" height="14" rx="1" stroke="#8A8A8A" stroke-width="1.2" fill="none"/>
  
  <!-- 文字行 -->
  <line x1="9" y1="7" x2="15" y2="7" stroke="#8A8A8A" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="9" y1="10" x2="15" y2="10" stroke="#8A8A8A" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="9" y1="13" x2="13" y2="13" stroke="#8A8A8A" stroke-width="1.2" stroke-linecap="round"/>
  
  <!-- 底部按钮 -->
  <circle cx="12" cy="20" r="1" stroke="#8A8A8A" stroke-width="1" fill="none"/>
</svg>
