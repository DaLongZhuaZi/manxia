<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Markdown Preview</title>
  <link rel="stylesheet" href="libs/github-markdown.css">
  <link rel="stylesheet" href="libs/highlight.css">
  <link rel="stylesheet" href="libs/katex.min.css" onerror="this.href='https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.css'">
  <script>
    window.onerror = function(message, source, lineno, colno, error) {
      console.error("Global Error: " + message + " at " + source + ":" + lineno + ":" + colno);
    };
    window.addEventListener('unhandledrejection', function(event) {
      console.error("Unhandled Promise Rejection: " + (event.reason ? event.reason.toString() : 'Unknown'));
    });
  </script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    :root {
      --reader-font-size: 16px;
      --reader-line-height: 1.6;
      --reader-font-family: "HarmonyOS Sans", sans-serif;
      --reader-font-weight: 400;
      --reader-text-color: #c9d1d9;
      --reader-background-color: transparent;
      --reader-page-margin: 16px;
      --reader-page-top-margin: 24px;
      --reader-page-bottom-margin: 24px;
      --reader-letter-spacing: 0px;
      --reader-paragraph-spacing: 8px;
      --reader-first-line-indent: 0em;
      --reader-text-align: left;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow-x: hidden;
      overflow-y: auto;
      background-color: var(--reader-background-color);
    }
    body {
      padding: var(--reader-page-top-margin) var(--reader-page-margin) var(--reader-page-bottom-margin);
      background-color: var(--reader-background-color);
      color: var(--reader-text-color);
      font-size: var(--reader-font-size);
      font-family: var(--reader-font-family);
      font-weight: var(--reader-font-weight);
      letter-spacing: var(--reader-letter-spacing);
      text-align: var(--reader-text-align);
      scroll-behavior: auto;
    }
    body.light-theme {
      background-color: var(--reader-background-color);
      color: var(--reader-text-color);
    }
    body.reader-scroll-smooth {
      scroll-behavior: smooth;
    }
    body.reader-horizontal-page-mode {
      scroll-snap-type: y proximity;
    }
    .markdown-body {
      max-width: 100%;
      background-color: transparent;
      color: inherit;
      font-size: var(--reader-font-size);
      font-family: var(--reader-font-family);
      font-weight: var(--reader-font-weight);
      line-height: var(--reader-line-height);
      letter-spacing: var(--reader-letter-spacing);
      text-align: var(--reader-text-align);
    }
    body.reader-horizontal-page-mode .markdown-body h1,
    body.reader-horizontal-page-mode .markdown-body h2,
    body.reader-horizontal-page-mode .markdown-body h3 {
      scroll-snap-align: start;
    }
    /* 深色模式文字颜色 */
    .markdown-body h1, .markdown-body h2, .markdown-body h3,
    .markdown-body h4, .markdown-body h5, .markdown-body h6 {
      color: var(--reader-text-color);
      border-bottom-color: #30363d;
    }
    .markdown-body p, .markdown-body li, .markdown-body td {
      color: var(--reader-text-color);
      line-height: var(--reader-line-height);
    }
    .markdown-body p {
      margin-bottom: var(--reader-paragraph-spacing);
      text-indent: var(--reader-first-line-indent);
    }
    body.light-theme .markdown-body h1, body.light-theme .markdown-body h2,
    body.light-theme .markdown-body h3, body.light-theme .markdown-body h4,
    body.light-theme .markdown-body h5, body.light-theme .markdown-body h6 {
      color: var(--reader-text-color);
      border-bottom-color: #d0d7de;
    }
    body.light-theme .markdown-body p, body.light-theme .markdown-body li,
    body.light-theme .markdown-body td {
      color: var(--reader-text-color);
    }
    .markdown-body pre {
      background-color: #161b22;
      border-radius: 6px;
      padding: 16px;
      overflow-x: auto;
    }
    body.light-theme .markdown-body pre {
      background-color: #f6f8fa;
    }
    .markdown-body code {
      background-color: rgba(110, 118, 129, 0.4);
      border-radius: 6px;
      padding: 0.2em 0.4em;
      font-size: 85%;
    }
    .markdown-body pre code {
      background-color: transparent;
      padding: 0;
    }
    .markdown-body img {
      max-width: 100%;
      height: auto;
    }
    .markdown-body table {
      width: 100%;
      border-collapse: collapse;
      margin: 16px 0;
    }
    .markdown-body th, .markdown-body td {
      border: 1px solid #30363d;
      padding: 8px 12px;
    }
    body.light-theme .markdown-body th,
    body.light-theme .markdown-body td {
      border-color: #d0d7de;
    }
    .markdown-body th {
      background-color: #161b22;
    }
    body.light-theme .markdown-body th {
      background-color: #f6f8fa;
    }
    .markdown-body blockquote {
      border-left: 4px solid #30363d;
      padding-left: 16px;
      color: #8b949e;
      margin: 16px 0;
    }
    body.light-theme .markdown-body blockquote {
      border-left-color: #d0d7de;
      color: #57606a;
    }
    .markdown-body hr {
      border: none;
      border-top: 1px solid #30363d;
      margin: 24px 0;
    }
    body.light-theme .markdown-body hr {
      border-top-color: #d0d7de;
    }
    .markdown-body a {
      color: #58a6ff;
      text-decoration: none;
    }
    .markdown-body a:hover {
      text-decoration: underline;
    }
    body.light-theme .markdown-body a {
      color: #0969da;
    }
    .markdown-body h1, .markdown-body h2 {
      border-bottom: 1px solid #30363d;
      padding-bottom: 0.3em;
    }
    body.light-theme .markdown-body h1,
    body.light-theme .markdown-body h2 {
      border-bottom-color: #d0d7de;
    }
    /* 任务列表样式 */
    .markdown-body .task-list-item {
      list-style-type: none;
    }
    .markdown-body .task-list-item input {
      margin-right: 8px;
    }
    /* 数学公式样式 */
    .katex-display {
      overflow-x: auto;
      overflow-y: hidden;
    }
    /* 隐藏默认脚注块 */
    .footnotes[data-footnotes] {
      display: none !important;
    }

    /* 脚注气泡样式 (毛玻璃效果) */
    .footnote-popup {
      position: absolute;
      z-index: 9999;
      background: rgba(30, 35, 40, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      color: #e6edf3;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
      max-width: 90vw;
      width: max-content;
      min-width: 200px;
      padding: 0;
      font-size: 14px;
      animation: popIn 0.2s cubic-bezier(0.18, 0.89, 0.32, 1.28);
    }
    body.light-theme .footnote-popup {
      background: rgba(246, 248, 250, 0.85);
      color: #1f2328;
      border: 1px solid rgba(0, 0, 0, 0.1);
      box-shadow: 0 8px 32px rgba(0,0,0,0.15);
    }
    .footnote-popup-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 16px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      font-weight: bold;
      font-size: 12px;
      color: #8b949e;
    }
    body.light-theme .footnote-popup-header {
      border-bottom-color: rgba(0,0,0,0.1);
      color: #656d76;
    }
    .footnote-popup-close {
      cursor: pointer;
      font-size: 18px;
      line-height: 1;
      padding: 0 4px;
    }
    .footnote-popup-content {
      padding: 12px 16px;
      max-height: 40vh;
      overflow-y: auto;
    }
    .footnote-popup-content p {
      margin: 0;
    }
    @keyframes popIn {
      from { opacity: 0; transform: translateY(8px) scale(0.95); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    #loading {
      text-align: center;
      padding: 40px;
      color: #8b949e;
    }
  </style>
</head>
<body>
  <div id="loading">加载中...</div>
  <article id="content" class="markdown-body" style="display: none;"></article>
  
  <!-- 优先使用本地库，回退到CDN -->
  <script src="libs/marked.min.js" onerror="loadFromCDN('marked')"></script>
  <script src="libs/highlight.min.js" onerror="loadFromCDN('hljs')"></script>
  <script src="libs/purify.min.js" onerror="loadFromCDN('purify')"></script>
  <script src="libs/katex.min.js" onerror="loadFromCDN('katex')"></script>
  <script src="libs/marked-katex.min.js" onerror="loadFromCDN('marked-katex')"></script>
  <script src="libs/marked-footnote.min.js" onerror="loadFromCDN('marked-footnote')"></script>
  <script src="libs/mermaid.min.js" onerror="loadFromCDN('mermaid')"></script>
  <script>
    // CDN回退加载
    function loadFromCDN(lib) {
      var script = document.createElement('script');
      switch(lib) {
        case 'marked':
          script.src = 'https://cdn.jsdelivr.net/npm/marked@11.1.1/marked.min.js';
          break;
        case 'hljs':
          script.src = 'https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/highlight.min.js';
          break;
        case 'purify':
          script.src = 'https://cdn.jsdelivr.net/npm/dompurify@3.0.8/dist/purify.min.js';
          break;
        case 'katex':
          script.src = 'https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.js';
          break;
        case 'marked-katex':
          script.src = 'https://cdn.jsdelivr.net/npm/marked-katex-extension@5.0.0/lib/index.umd.js';
          break;
        case 'marked-footnote':
          script.src = 'https://cdn.jsdelivr.net/npm/marked-footnote@1.2.4/dist/index.umd.js';
          break;
        case 'mermaid':
          script.src = 'https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js';
          break;
      }
      document.head.appendChild(script);
    }
  </script>
  <script>
    // 配置marked (v11+)
    marked.use({
      breaks: true,
      gfm: true
    });
    
    // 自定义渲染器
    marked.use({
      renderer: {
        // 任务列表支持
        listitem(text, task, checked) {
          if (task) {
            return `<li class="task-list-item"><input type="checkbox" ${checked ? 'checked' : ''} disabled> ${text}</li>`;
          }
          return `<li>${text}</li>`;
        },
        // 链接在新窗口打开
        link(href, title, text) {
          const titleAttr = title ? ` title="${title}"` : '';
          return `<a href="${href}"${titleAttr} target="_blank" rel="noopener noreferrer">${text}</a>`;
        },
        // 图片懒加载
        image(href, title, text) {
          const titleAttr = title ? ` title="${title}"` : '';
          const altAttr = text ? ` alt="${text}"` : '';
          return `<img src="${href}"${altAttr}${titleAttr} loading="lazy">`;
        }
      }
    });
    
    // 注册数学公式和脚注
    if (typeof markedKatex !== 'undefined') {
      marked.use(markedKatex({ throwOnError: false }));
    }
    if (typeof markedFootnote !== 'undefined') {
      marked.use(markedFootnote());
    }
    
    // 初始化mermaid
    if (typeof mermaid !== 'undefined') {
      mermaid.initialize({ startOnLoad: false, theme: document.body.classList.contains('light-theme') ? 'default' : 'dark' });
    }

    const defaultReaderStyle = {
      fontSize: 16,
      lineHeight: 1.6,
      fontFamily: 'HarmonyOS Sans',
      fontWeight: 400,
      textColor: '#c9d1d9',
      backgroundColor: 'transparent',
      pageMargin: 16,
      pageTopMargin: 24,
      pageBottomMargin: 24,
      letterSpacing: 0,
      paragraphSpacing: 8,
      firstLineIndent: 0,
      textAlignment: 'LEFT',
      pageMode: '0',
      pageTurnAnimation: 'SLIDE',
      tapToTurn: true
    };
    let activeReaderStyle = Object.assign({}, defaultReaderStyle);
    let progressNotifyTimer = -1;

    function toFiniteNumber(value, fallback) {
      const numericValue = Number(value);
      return Number.isFinite(numericValue) ? numericValue : fallback;
    }

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function normalizeTextAlignment(value) {
      if (value === 'CENTER') return 'center';
      if (value === 'RIGHT') return 'right';
      if (value === 'JUSTIFY') return 'justify';
      return 'left';
    }

    function getMaxScrollTop() {
      const scrollHeight = Math.max(
        document.documentElement.scrollHeight,
        document.body.scrollHeight
      );
      const viewportHeight = window.innerHeight || document.documentElement.clientHeight || 1;
      return Math.max(0, scrollHeight - viewportHeight);
    }

    function getScrollTop() {
      return window.scrollY || document.documentElement.scrollTop || document.body.scrollTop || 0;
    }

    function getReaderProgress() {
      const maxScrollTop = getMaxScrollTop();
      if (maxScrollTop <= 0) {
        return 0;
      }
      return clamp((getScrollTop() / maxScrollTop) * 100, 0, 100);
    }

    function buildReaderSnapshot() {
      const maxScrollTop = getMaxScrollTop();
      const scrollTop = clamp(getScrollTop(), 0, maxScrollTop);
      const viewportHeight = window.innerHeight || document.documentElement.clientHeight || 1;
      const pageCount = Math.max(1, Math.ceil((maxScrollTop + viewportHeight) / Math.max(1, viewportHeight)));
      const currentPage = Math.max(1, Math.min(pageCount, Math.floor(scrollTop / Math.max(1, viewportHeight)) + 1));
      return {
        progress: getReaderProgress(),
        scrollTop: scrollTop,
        maxScrollTop: maxScrollTop,
        currentPage: currentPage,
        pageCount: pageCount
      };
    }

    function notifyProgressChange(force) {
      if (!force) {
        if (progressNotifyTimer !== -1) {
          clearTimeout(progressNotifyTimer);
        }
        progressNotifyTimer = setTimeout(function() {
          progressNotifyTimer = -1;
          notifyProgressChange(true);
        }, 260);
        return;
      }
      try {
        if (window.arkts && window.arkts.onProgressChange) {
          window.arkts.onProgressChange(getReaderProgress());
        }
      } catch (e) {
        console.error('onProgressChange error:', e);
      }
    }

    function applyReaderStyle(style) {
      try {
        const incoming = typeof style === 'string' ? JSON.parse(style) : (style || {});
        activeReaderStyle = Object.assign({}, defaultReaderStyle, incoming);
        const rootStyle = document.documentElement.style;
        const bodyStyle = document.body.style;
        const content = document.getElementById('content');
        const fontSize = clamp(toFiniteNumber(activeReaderStyle.fontSize, defaultReaderStyle.fontSize), 8, 72);
        const lineHeight = clamp(toFiniteNumber(activeReaderStyle.lineHeight, defaultReaderStyle.lineHeight), 1, 3);
        const pageMargin = clamp(toFiniteNumber(activeReaderStyle.pageMargin, defaultReaderStyle.pageMargin), 0, 96);
        const pageTopMargin = clamp(toFiniteNumber(activeReaderStyle.pageTopMargin, activeReaderStyle.pageMargin), 0, 160);
        const pageBottomMargin = clamp(toFiniteNumber(activeReaderStyle.pageBottomMargin, activeReaderStyle.pageMargin), 0, 160);
        const letterSpacing = clamp(toFiniteNumber(activeReaderStyle.letterSpacing, 0), 0, 12);
        const paragraphSpacing = clamp(toFiniteNumber(activeReaderStyle.paragraphSpacing, 8), 0, 48);
        const firstLineIndent = clamp(toFiniteNumber(activeReaderStyle.firstLineIndent, 0), 0, 4);
        const fontWeight = clamp(toFiniteNumber(activeReaderStyle.fontWeight, 400), 100, 900);
        const textColor = activeReaderStyle.textColor || defaultReaderStyle.textColor;
        const backgroundColor = activeReaderStyle.backgroundColor || defaultReaderStyle.backgroundColor;
        const fontFamily = activeReaderStyle.fontFamily || defaultReaderStyle.fontFamily;
        const textAlignment = normalizeTextAlignment(activeReaderStyle.textAlignment || defaultReaderStyle.textAlignment);

        rootStyle.setProperty('--reader-font-size', fontSize + 'px');
        rootStyle.setProperty('--reader-line-height', String(lineHeight));
        rootStyle.setProperty('--reader-font-family', `"${String(fontFamily).replace(/"/g, '\\"')}", sans-serif`);
        rootStyle.setProperty('--reader-font-weight', String(fontWeight));
        rootStyle.setProperty('--reader-text-color', textColor);
        rootStyle.setProperty('--reader-background-color', backgroundColor);
        rootStyle.setProperty('--reader-page-margin', pageMargin + 'px');
        rootStyle.setProperty('--reader-page-top-margin', pageTopMargin + 'px');
        rootStyle.setProperty('--reader-page-bottom-margin', pageBottomMargin + 'px');
        rootStyle.setProperty('--reader-letter-spacing', letterSpacing + 'px');
        rootStyle.setProperty('--reader-paragraph-spacing', paragraphSpacing + 'px');
        rootStyle.setProperty('--reader-first-line-indent', firstLineIndent + 'em');
        rootStyle.setProperty('--reader-text-align', textAlignment);

        bodyStyle.backgroundColor = backgroundColor;
        bodyStyle.color = textColor;
        bodyStyle.fontSize = fontSize + 'px';
        bodyStyle.fontFamily = `"${String(fontFamily).replace(/"/g, '\\"')}", sans-serif`;
        bodyStyle.fontWeight = String(fontWeight);
        if (content) {
          content.style.fontSize = fontSize + 'px';
          content.style.color = textColor;
          content.style.fontFamily = bodyStyle.fontFamily;
          content.style.fontWeight = String(fontWeight);
        }
        document.body.classList.toggle('reader-scroll-smooth', activeReaderStyle.pageTurnAnimation !== 'NONE');
        document.body.classList.toggle('reader-horizontal-page-mode', String(activeReaderStyle.pageMode || '0') === '1');
        setTimeout(function() {
          notifyProgressChange(true);
        }, 0);
      } catch (e) {
        console.error('applyReaderStyle error:', e);
      }
    }

    function scrollToReaderProgress(progress) {
      const safeProgress = clamp(toFiniteNumber(progress, 0), 0, 100);
      const targetTop = getMaxScrollTop() * safeProgress / 100;
      window.scrollTo({ top: targetTop, behavior: activeReaderStyle.pageTurnAnimation === 'NONE' ? 'auto' : 'smooth' });
      setTimeout(function() {
        notifyProgressChange(true);
      }, 180);
    }

    function getReaderScrollSnapshot() {
      return JSON.stringify(buildReaderSnapshot());
    }

    function buildPageTurnResult(moved, boundary) {
      const snapshot = buildReaderSnapshot();
      return JSON.stringify({
        moved: moved,
        boundary: boundary || '',
        progress: snapshot.progress,
        scrollTop: snapshot.scrollTop,
        maxScrollTop: snapshot.maxScrollTop
      });
    }

    function turnReaderPage(forward) {
      const maxScrollTop = getMaxScrollTop();
      const scrollTop = clamp(getScrollTop(), 0, maxScrollTop);
      const viewportHeight = window.innerHeight || document.documentElement.clientHeight || 1;
      const distanceRatio = String(activeReaderStyle.pageMode || '0') === '1' ? 0.96 : 0.88;
      const pageDistance = Math.max(1, Math.floor(viewportHeight * distanceRatio));
      if (forward && scrollTop >= maxScrollTop - 2) {
        return buildPageTurnResult(false, 'end');
      }
      if (!forward && scrollTop <= 2) {
        return buildPageTurnResult(false, 'start');
      }
      const targetTop = forward
        ? Math.min(maxScrollTop, scrollTop + pageDistance)
        : Math.max(0, scrollTop - pageDistance);
      window.scrollTo({
        top: targetTop,
        behavior: activeReaderStyle.pageTurnAnimation === 'NONE' ? 'auto' : 'smooth'
      });
      setTimeout(function() {
        notifyProgressChange(true);
      }, 180);
      return buildPageTurnResult(true, '');
    }
    
    // 渲染Markdown
    function renderMarkdown(markdown) {
      document.getElementById('loading').style.display = 'none';
      const content = document.getElementById('content');
      content.style.display = 'block';
      
      try {
        // 解析Markdown前规范化换行符，以防止marked-katex正则匹配失败
        const normalizedMarkdown = (markdown || '').replace(/\r\n/g, '\n');
        const html = marked.parse(normalizedMarkdown);
        // 使用DOMPurify清理HTML，防止XSS攻击
        const cleanHtml = DOMPurify.sanitize(html, {
          ADD_TAGS: ['iframe', 'math', 'semantics', 'mrow', 'mi', 'mo', 'mn', 'msup', 'mfrac', 'annotation'],
          ADD_ATTR: ['target', 'rel', 'loading'],
          USE_PROFILES: { html: true, svg: true, mathMl: true }
        });
        content.innerHTML = cleanHtml;
        
        // 高亮代码块（检查hljs是否可用）
        if (typeof hljs !== 'undefined') {
          content.querySelectorAll('pre code').forEach((block) => {
            if (!block.classList.contains('language-mermaid') && !block.classList.contains('language-math')) {
              hljs.highlightElement(block);
            }
          });
        }
        
        // 渲染mermaid
        if (typeof mermaid !== 'undefined') {
          try {
            mermaid.run({
              nodes: content.querySelectorAll('pre code.language-mermaid')
            });
          } catch(err) {
            console.error('Mermaid render error:', err);
          }
        }

        setTimeout(function() {
          notifyProgressChange(true);
        }, 0);
        // 通知ArkTS渲染完成
        notifyRenderComplete();
      } catch (e) {
        content.innerHTML = `<p style="color: #f85149;">渲染错误: ${e.message}</p>`;
        console.error('Markdown render error:', e);
      }
    }
    
    // 设置主题
    function setTheme(theme) {
      if (theme === 'light') {
        document.body.classList.add('light-theme');
      } else {
        document.body.classList.remove('light-theme');
      }
      if (typeof mermaid !== 'undefined') {
        mermaid.initialize({ theme: theme === 'light' ? 'default' : 'dark' });
      }
    }
    
    // 设置字体大小
    function setFontSize(size) {
      document.body.style.fontSize = size + 'px';
      const content = document.getElementById('content');
      if (content) {
        content.style.fontSize = size + 'px';
      }
      document.documentElement.style.setProperty('--reader-font-size', size + 'px');
      notifyProgressChange(true);
    }
    
    // 滚动到指定位置
    function scrollTo(position) {
      window.scrollTo({ top: position, behavior: 'smooth' });
    }
    
    // 滚动到指定标题
    function scrollToHeading(id) {
      const element = document.getElementById(id);
      if (element) {
        element.scrollIntoView({ behavior: 'smooth' });
      }
    }
    
    // 获取目录
    function getTableOfContents() {
      const headings = document.querySelectorAll('h1, h2, h3, h4, h5, h6');
      const toc = [];
      headings.forEach((heading, index) => {
        const level = parseInt(heading.tagName.charAt(1));
        const text = heading.textContent;
        const id = heading.id || `heading-${index}`;
        if (!heading.id) {
          heading.id = id;
        }
        toc.push({ level, text, id });
      });
      return JSON.stringify(toc);
    }

    // 通知ArkTS渲染完成
    function notifyRenderComplete() {
      try {
        if (window.arkts && window.arkts.onRenderComplete) {
          window.arkts.onRenderComplete();
        }
      } catch (e) {
        console.error('notifyRenderComplete error:', e);
      }
    }
    
    // 显示脚注气泡
    function showFootnotePopup(element, html) {
      let existing = document.getElementById('footnote-popup');
      if (existing) existing.remove();

      const popup = document.createElement('div');
      popup.id = 'footnote-popup';
      popup.className = 'footnote-popup';

      const tempDiv = document.createElement('div');
      tempDiv.innerHTML = html;
      const backrefs = tempDiv.querySelectorAll('[data-footnote-backref]');
      backrefs.forEach(el => el.remove());

      const header = document.createElement('div');
      header.className = 'footnote-popup-header';
      header.innerHTML = '<span>脚注 (Footnote)</span><span class="footnote-popup-close">×</span>';

      const content = document.createElement('div');
      content.className = 'footnote-popup-content';
      content.innerHTML = tempDiv.innerHTML.trim();

      popup.appendChild(header);
      popup.appendChild(content);

      header.querySelector('.footnote-popup-close').onclick = function() {
        popup.remove();
      };

      document.body.appendChild(popup);

      const rect = element.getBoundingClientRect();
      let top = rect.bottom + window.scrollY + 12;
      let left = rect.left + window.scrollX - 20;

      // 避免超出屏幕边界
      if (left + popup.offsetWidth > window.innerWidth - 16) {
        left = window.innerWidth - popup.offsetWidth - 16;
      }
      if (left < 16) left = 16;

      popup.style.top = top + 'px';
      popup.style.left = left + 'px';
    }

    // 通知ArkTS链接被点击，或拦截脚注点击
    document.addEventListener('click', function(e) {
      // 检查是否点击了脚注引用
      const fnRef = e.target.closest('a[data-footnote-ref]');
      if (fnRef) {
        e.preventDefault();
        const targetId = fnRef.getAttribute('href').substring(1);
        const li = document.getElementById(targetId);
        if (li) {
          showFootnotePopup(fnRef, li.innerHTML);
        }
        return;
      }

      // 检查是否需要关闭气泡（点击在气泡外部）
      const popup = document.getElementById('footnote-popup');
      if (popup && !e.target.closest('#footnote-popup')) {
        popup.remove();
      }

      if (e.target.tagName === 'A' && !e.target.closest('#footnote-popup')) {
        const href = e.target.getAttribute('href');
        if (href && !href.startsWith('#')) {
          e.preventDefault();
          try {
            if (window.arkts && window.arkts.onLinkClick) {
              window.arkts.onLinkClick(href);
            }
          } catch (err) {
            console.error('onLinkClick error:', err);
          }
        }
        return;
      }

      if (!e.target.closest('#footnote-popup')) {
        const viewportWidth = window.innerWidth || document.documentElement.clientWidth || 1;
        const tapX = e.clientX;
        let zone = 'center';
        if (tapX < viewportWidth * 0.33) {
          zone = 'left';
        } else if (tapX > viewportWidth * 0.67) {
          zone = 'right';
        }
        try {
          if (window.arkts && window.arkts.onReaderTap) {
            window.arkts.onReaderTap(zone);
          }
        } catch (err) {
          console.error('onReaderTap error:', err);
        }
      }
    });

    window.addEventListener('scroll', function() {
      notifyProgressChange(false);
    }, { passive: true });
    
    // 页面加载完成
    document.addEventListener('DOMContentLoaded', function() {
      try {
        applyReaderStyle(activeReaderStyle);
        if (window.arkts && window.arkts.onPageReady) {
          window.arkts.onPageReady();
        }
      } catch (e) {
        console.error('onPageReady error:', e);
      }
    });
  </script>
</body>
</html>
